# CANONICAL-DOCS.toml — what this repo publishes.
#
# The keep-list IS the interface: what reaches a public reader is decided here and
# nowhere else. A file that is not declared and sits under a doc root is dropped
# silently, so anything a published document links to belongs in this list.
#
# The audience is someone OUTSIDE this ecosystem who wants to check an implementation
# against the protocol. `requirements/` is the thing they want; the suites are how we
# show the requirements are unambiguous enough to be implemented twice.
#
# Non-prose files (`.diag`, `.cbor`, source, configs) are never dropped by the filter,
# so the requirement corpus, the suites and the pinned snapshots publish as code. What
# is declared below is the PROSE that explains them.

[project]
name   = "Entity System Conformance"
slug   = "entity-system-conformance"
repo   = "entity-system-conformance"
github = "https://github.com/EntityChurch/entity-system-conformance"
intro  = """
The independent conformance instrument for the Entity Core Protocol: a neutral statement
of what the protocol requires, and several independently built test suites over it. A
single oracle cannot distinguish "the peer is wrong" from "the oracle is wrong" — its own
errors are invisible by construction — so this repo separates the obligation from the
probe and implements the obligations more than once, in different languages, by different
authors, without them reading each other. Where the suites agree, the requirement said so;
where they disagree, the disagreement is the product, and it is always exactly one of three
things: a specification gap, an implementation bug, or a bad check. Early and honest about
it: 50 requirements authored, 15 of the core floor's 98 obligations covered, 28 requirements
executed against real peers, two suites. The numbers this repo publishes about itself are
ratcheted and are lowered by doing the work, never by editing the number.
"""

