## ECP-R10 — every peer_id the peer emits for ITSELF is derive_peer_id(public_key, key_type): the canonical form.
##
## Batch 4 (`peer_canonicalization`). The floor row says "Peer ID derivation (§7.4; canonical `hash_type`/digest
## form per the §1.5 table — §7.4 defers to §1.5, cite §1.5 for the form)". The emit side only. The receive side — a NON-canonical form presented TO the
## peer — has no floor row and is authored separately (F37).

[requirement]
id         = "ECP-R10"
id_status  = "allocated"
title      = "Every peer_id the peer emits for its own identity is Base58(varint(key_type) || varint(canonical hash_type) || digest) per the §1.5 table — for Ed25519, Base58(0x01 0x00 || public_key)"
spec       = "ENTITY-CORE-PROTOCOL §7.4 ('Implementations MUST construct using canonical `hash_type` per the §1.5 table') and §1.5 ('Wire `peer_id`s in tree-path segments and operational use MUST use canonical form')"
spec_also  = ["§1.5 canonical-form table (Ed25519 0x01 → hash_type 0x00, digest = public_key)", "§1.4 ('Path segments MUST use canonical `peer_id` form per §1.5 v7.65 contract')", "§7.3 multicodec-style varint (all current codes are one byte)", "§3.8 system/protocol/connect/hello.peer_id", "§4.4 ('The token entity, granter identity, and capability signature are in the envelope's `included` map')", "§6.9a.2 (the authenticate response's grant)", "§9.1 (the floor row this id binds)"]
snapshot   = "core-0.8.2.21"
level      = "MUST"
profile    = ["core"]
surface    = "wire"
status     = "draft"

reading = """
TWO KEYWORDS, ONE FUNCTION. §7.4: "Implementations MUST construct using canonical `hash_type` per the §1.5
table". §1.5: "Wire `peer_id`s in tree-path segments and operational use MUST use canonical form." Both are
satisfied by exactly one string per identity, `derive_peer_id(public_key, key_type)`, and both are violated
by any other. So this is ONE obligation observed at several surfaces, not a bundle: a peer cannot choose the
right `hash_type` and the wrong digest and still produce the derived string, and the string is the only thing
observed. (Contrast `ECP-R4`/`ECP-R7`, where the two halves are different acts.)

WHAT IS OBSERVABLE, AND FROM WHERE. From the string alone the suite decodes `varint(key_type) ||
varint(hash_type) || digest` and asserts `hash_type` is the canonical one for that `key_type`. That catches the
SHA-256 form (`0x01 0x01 || SHA-256(P)`), which §7.4 calls "NOT a valid construction form for v7.65+". It cannot
catch a string whose digest is not the peer's OWN key. For that the key is needed, and leg 2 carries it: §4.4,
"The token entity, granter identity, and capability signature are in the envelope's `included` map" of the
authenticate response. So: `derive_peer_id(granter.public_key, granter.key_type) == hello.peer_id`, for every
key_type, plus the capability signature verifying under that key. ⚠ Corrected after review: a first draft said
the responder's key is not on legs 1–2 and tied the signature to §6.9a.0's artifact shapes — those govern how
seed entries are STORED ("impl-private per §9.4"), not what §4.4 puts on the wire. If §4.4's `included` entries
are absent, that is §4.4's failure; this member records not-observed and scores nothing.

WHERE THE PEER EMITS ITS OWN peer_id. `hello` response data `peer_id` (§3.8) — always. The authenticate
response's grant, where a `resources` pattern is written absolute (`/{peer_id}/…`) — only if the grant is
written that way (§1.4 permits peer-relative). Any path the peer returns in a listing under its own
namespace. The first is unconditional; the others are witnessed where present.

THE UNFOLDED NORM THIS ABSORBS (F28). The reference check `peer_mut_1_one_form_per_operational_window`
cites "v7.65 norm 1": "Peers SHOULD publish exactly one canonical-form `peer_id` per identity at any
operational moment." That sentence is in no specification (F28). What the snapshot DOES bind entails its
observable content at a stronger level: if every emitted instance MUST be the one derived string, then all
instances are one form. So the "two connections, same string" member below is scored here, at MUST, from
§1.5 — and not as a SHOULD from a proposal.
"""

[requirement.preconditions]
grants       = []
identities   = ["caller"]
handlers     = []
posture_axes = ["seed_policy", "responder_key_type"]
note         = "posture-free. The key members need §4.4's granter entity and capability signature in the authenticate response's included map; absent → not-observed here (a §4.4 failure, scored elsewhere)."

[requirement.domain]
axis    = "emitted_own_peer_id"
members = ["hello response data.peer_id", "the same field on a second, independent connection (must be the identical string)", "absolute resource patterns in the authenticate response's grant, where present", "derive_peer_id(included granter public_key, key_type) equals hello.peer_id", "the included capability signature (signer = granter) verifies under that key"]

[[requirement.arm]]
name  = "canonical"
kind  = "conformant"
given = "legs 1–2 of the handshake, twice, on independent connections"
why   = "§7.4's construction MUST and §1.5's operational-use MUST, at every surface the peer names itself."
  [[requirement.arm.step]]
  op      = "connect"
  capture = "first"
  [[requirement.arm.step]]
  op      = "connect"
  capture = "second"
  [[requirement.arm.assert]]
  kind    = "peer_id_is_canonical_form"
  capture = "first"
  field   = "hello.peer_id"
  why     = "decode Base58; key_type 0x01 requires hash_type 0x00 and a 32-byte digest. A 0x01 hash_type is the pre-v7.64 SHA-256 form (§7.4)."
  [[requirement.arm.assert]]
  kind    = "same_string"
  capture = "first,second"
  field   = "hello.peer_id"
  why     = "entailed by the canonical MUST: one derived string per identity. Absorbs F28's unfolded norm 1."
  [[requirement.arm.assert]]
  kind    = "peer_id_is_canonical_form"
  capture = "first"
  field   = "the first segment of each absolute resource pattern in the authenticate response's grant"
  when    = "such a pattern is present"
  [[requirement.arm.assert]]
  kind    = "derived_peer_id_equals"
  capture = "first"
  from    = "included granter system/peer (public_key, key_type)"
  field   = "hello.peer_id"
  when    = "§4.4's included granter entity is present"
  why     = "the only way to catch a canonical-LOOKING string that names somebody else's key."
  [[requirement.arm.assert]]
  kind    = "capability_signature_verifies_under"
  capture = "first"
  key     = "included granter public_key"
  when    = "§4.4's included capability signature is present"

[[requirement.arm]]
name   = "control"
kind   = "negative-control"
given  = "the assertion `peer_id_is_canonical_form` applied, suite-side, to two fixtures built from one Ed25519 key P: Base58(0x01 0x00 || P) and Base58(0x01 0x01 || SHA-256(P))"
expect = "passes on the first; fails on the second"
why    = "MANDATORY ANTI-VACUITY for the suite. No conformant peer can be made to emit the SHA-256 form, so the discrimination is proven on fixtures: an assertion that only checks Base58 decodability or length passes both (both decode to 34 bytes), which is exactly the defect this row exists to catch."

[[requirement.arm]]
name   = "non-conformant-witness"
kind   = "non-conformant"
given  = "a peer still constructing the pre-v7.64 form, or one that mints a fresh form per connection"
expect = "hello.peer_id decodes with hash_type 0x01 for key_type 0x01; or the two connections present different strings"
why    = "§1.5's operator-coherence argument: a cap pattern written against one form never string-matches the other, so the peer's own owner authority (`/{peer_id}/*`, §6.9a) names a namespace its runtime does not use."

[requirement.notes]
peer_attributable = true
oracle_check      = "peer_canonicalization/peer_mut_1_one_form_per_operational_window"
oracle_note       = "provenance only. The check cites a proposal norm (F28); this file scores the snapshot's MUST that entails its observable content. The oracle's severity for that check is not known from its citation and was not read."
