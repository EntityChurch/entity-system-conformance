## ECP-R4-pending-b — an entity is not refused because it carries fields the peer does not model, or null optionals.
##
## Batch 3. The second obligation under the fidelity row: NOT REJECTING fails independently of
## PRESERVING. Number arch's (CQ-2). Routed F27.

[requirement]
id_status   = "pending-split"
under       = "ECP-R4"
split_index = "b"
routed      = "docs/status/FINDINGS-FROM-AUTHORING.md F27"
title       = "A received entity is not refused for carrying data fields outside its type definition, or optional fields whose value is null"
spec        = "ENTITY-CORE-PROTOCOL §2.10 ('Implementations MUST NOT reject entities because of unknown fields.')"
spec_also   = ["§1.3 ('Implementations MUST NOT reject entities that include optional fields with null or zero values.')", "ENTITY-CBOR-ENCODING §4.7 hello CDDL (`* tstr => any`)"]
snapshot    = "core-0.8.2.21"
level       = "MUST NOT"
profile     = ["core"]
surface     = "wire"
status      = "draft"

reading = """
§2.10: "Entities MAY contain fields in `data` not defined in the type. Unknown fields MUST be preserved
on storage and forwarding. Implementations MUST NOT reject entities because of unknown fields." §1.3:
"the presence of an optional field with a null or zero value is semantically valid ... Implementations
MUST NOT reject entities that include optional fields with null or zero values."

WHY IT IS NOT ECP-R4. A peer that refuses a hello carrying an unknown field never stores anything, so it
never fails preservation — it fails this. And a peer that accepts everything and strips on storage fails
preservation and never fails this. Independently failable, one row. Routed.

THE PRIMARY SURFACE IS THE HELLO, and ENTITY-CBOR-ENCODING §4.7 makes it the cleanest one in the
protocol: its CDDL ends `* tstr => any` — the hello's own type admits extra keys by name. §4.2 puts it
before any grant, so no posture is involved. The put surface is a second member for the null case, where
the hello has no optional field to null (`hash_formats`/`key_types` are optional, but a null there
collides with §4.5's negotiation, which is a different rule — so they are not used).

MUST NOT REJECT IS NOT MUST SUCCEED. The hello with an extra key must be answered as a hello would be
without it; whatever that outcome is. The assertion is the pair's EQUALITY, not a 200 — so an unrelated
hello failure cannot be misread as this row passing or failing.
"""

[requirement.preconditions]
grants       = []
identities   = ["caller"]
handlers     = []
posture_axes = ["seed_policy"]
note         = "the put member additionally needs `system/tree: put`; without it that member is UNMEASURABLE and reported so."

[requirement.domain]
axis    = "unmodelled_content"
members = ["hello data: one extra key \"x_cnf_probe\": 1", "hello data: extra key holding a nested map", "tree:put entity {type: \"system/capability/request\", data: {grants: [], ttl_ms: null}} (requires put grant)"]

[[requirement.arm]]
name  = "not-refused"
kind  = "conformant"
given = "two fresh connections: hello A without the member, hello B identical plus the member"
why   = "§2.10 / §1.3's MUST NOT, measured as 'B is answered the way A is'."
  [[requirement.arm.step]]
  op      = "send_hello"
  capture = "baseline"
  [[requirement.arm.step]]
  op      = "send_hello"
  capture = "with_member"
  extra   = "the domain member"
  [[requirement.arm.assert]]
  kind    = "same_outcome_class"
  capture = "baseline,with_member"
  why     = "status and code of B equal A's. A refusal of B that A did not get is the failure."

[[requirement.arm]]
name  = "control"
kind  = "negative-control"
given = "the same_outcome_class assertion applied to fixture outcome pairs: (200, 400 non_canonical_ecf), (200, close), (200, 200 with a different code slot); and to (200, 200)"
why   = """MANDATORY ANTI-VACUITY, suite-side. The first three pairs must FAIL the assertion and the last must pass. \
This proves the pair comparison can detect a refusal at all — without it, a suite whose 'same outcome' assertion \
never looks past the transport passes every peer. \
⛔ CHANGED 2026-09-13 (d), found by running (F58): this control was hello B' = the member wrapped in a CBOR tag, \
which must be refused under ENTITY-CBOR-ENCODING §6.3. That borrowed another requirement's verdict: on a peer \
that accepts tags (UNALLOCATED-cbor-tag-rejected FAIL, measured on entity-core-go) this requirement could only \
ever be INCONCLUSIVE, whatever the peer did with unknown fields. The control's stated subject is the comparator, \
so it is now tested on the comparator. The tagged twin is still sent, as a witness."""
  [[requirement.arm.step]]
  op      = "replay_fixture"
  capture = "fixture"
  fixture = "four outcome pairs: three differing (must fail the assertion), one equal (must pass)"
  [[requirement.arm.assert]]
  kind    = "same_outcome_class"
  capture = "fixture"
  expect  = "fails on the three differing pairs; passes on the equal pair"
  [[requirement.arm.witness]]
  field = "tagged_member"
  why   = "hello B' (the member wrapped in tag 1), as the control was first written. Cohort data for UNALLOCATED-cbor-tag-rejected, never scored here."

[[requirement.arm]]
name   = "non-conformant-witness"
kind   = "non-conformant"
given  = "a peer that validates incoming entities strictly against their type definition, rejecting unknown keys"
expect = "every hello from a newer peer that adds a field is refused; the network cannot evolve a type without a flag day"
why    = "§2.10's rationale: 'Open types are load-bearing'."

[requirement.notes]
peer_attributable = true
oracle_check      = ""
