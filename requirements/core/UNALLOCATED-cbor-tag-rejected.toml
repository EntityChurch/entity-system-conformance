## UNALLOCATED — a received frame containing a CBOR tag in a data-field position is refused 400 non_canonical_ecf.
##
## Batch 3. A MUST with a pinned code and a normative vector set (Appendix E `tag_reject`), and no §9
## row. The same document's §9.2 says decoders MUST "Preserve unknown tags" — F21.

[requirement]
id_status = "unallocated"
under     = ""
title     = "A received protocol frame with a CBOR tag (major type 6) anywhere inside an entity's data is refused 400 non_canonical_ecf"
spec      = "ENTITY-CBOR-ENCODING §6.3 (Tag Handling Rules — Option B)"
spec_also = ["ENTITY-CBOR-ENCODING Appendix E `tag_reject.1`–`.5` (normative corpus)", "ENTITY-CORE-PROTOCOL §1.11 (tags are an internal-divergence feature: 'strip at the boundary')", "ENTITY-CBOR-ENCODING §9.2 item 2 (CONTRADICTS — F21)"]
snapshot  = "core-0.8.2.21"
level     = "MUST"
profile   = ["core"]
surface   = "wire"
status    = "draft"
routed    = "docs/status/FINDINGS-FROM-AUTHORING.md F21"

reading = """
§6.3: "conformant implementations MUST reject any received frame containing CBOR tags on data fields
with `400 non_canonical_ecf`." And: "Detection covers any CBOR major-type-6 item appearing anywhere
within an entity's `data` field at any nesting depth (top-level, inside nested arrays/maps, inside
`included` entities' data fields, etc.)" and "Implementations MUST NOT silently strip tags, MUST NOT
preserve them through forwarding, and MUST NOT attempt to interpret them."

THE CONTRADICTION, AND WHY THIS FILE IS NOT `disputed`. §9.2 "Decoder Requirements" lists "Decoders
MUST: ... 2. Preserve unknown tags". Read alone that is the opposite rule. Three things make §6.3 the
text and not a lean: (1) §6.3 negates §9.2's behaviour by name — "MUST NOT preserve them through
forwarding"; (2) the document declares Appendix E to be its normative conformance contract ("An
implementation of ECF is conformant iff it ... rejects the required non-canonical bytes for every
vector"), and Appendix E carries five `tag_reject` vectors and no tag-preservation vector; (3) core
§1.11, the other normative document, names tags as the worked example of a feature that is stripped at
the boundary. A reader who followed §9.2 would be non-conformant against the document's own corpus.
So the degrees of freedom are not real; the drift is. Routed as wording (F21), not as a ruling.

THE PROBE IS A HELLO WITH THE TAG ON A FIELD THE HELLO'S TYPE ALLOWS. ENTITY-CBOR-ENCODING §4.7's hello
CDDL admits `* tstr => any`, and ECP-R4-pending-b requires such a field not to be refused. So the
probe adds `"x_cnf_probe": 1(1713350272)` and the control adds `"x_cnf_probe": 1713350272`: the only
difference is the tag. The suite computes every content_hash over the bytes it sends, tag included, so
a refusal cannot be a hash mismatch.

THE 55799 MEMBER IS SHAPED DIFFERENTLY and its accept set says so: `tag_reject.4` is a tag around the
whole frame, not inside a data field, so there may be no decodable envelope to answer. A close is
accepted there and only there.

TAG 32. Appendix E §E.1 names tags "0, 1, 32, 37"; the pinned corpus has vectors for 0, 1, 37, 55799
and a nested tag-0, and none for 32. The member is included because §6.3's rule is "any major-type-6
item"; the corpus gap is recorded (F25).
"""

[requirement.preconditions]
grants       = []
identities   = ["caller"]
handlers     = []
posture_axes = ["seed_policy", "close_wait_bound"]

[requirement.domain]
axis    = "tag_position"
members = ["tag 0 on a top-level hello data field (tag_reject.1's shape)", "tag 1 on a top-level hello data field (tag_reject.2)", "tag 37 on a bstr in hello data (tag_reject.3)", "tag 32 on a tstr in hello data (no corpus vector)", "tag 1 inside an array inside a nested map in hello data", "tag 0 inside the data of an entity in the envelope's included map (tag_reject.5's shape)", "tag 55799 wrapping the whole frame payload (tag_reject.4)"]

[[requirement.arm]]
name  = "refused"
kind  = "conformant"
given = "a fresh connection per member; an otherwise correct hello carrying the tagged value, every hash computed over the tagged bytes"
why   = "§6.3's MUST, at its pinned code, once per member."
  [[requirement.arm.step]]
  op      = "send_hello"
  capture = "tagged"
  extra   = "the domain member"
  [[requirement.arm.assert]]
  kind    = "status"
  capture = "tagged"
  equals  = 400
  [[requirement.arm.assert]]
  kind    = "error_code"
  capture = "tagged"
  equals  = "non_canonical_ecf"
  why     = "the decoded result.data.code. For the 55799 member only, a close with no response is also accepted — see reading."

[[requirement.arm]]
name  = "control"
kind  = "negative-control"
given = "the same hello, same field, same value, untagged"
why   = """MANDATORY ANTI-VACUITY. The pair differs only in the tag byte(s). Without it, a peer that refuses \
every hello carrying an unknown field — a different defect, ECP-R4-pending-b's — passes this row."""
  [[requirement.arm.step]]
  op      = "send_hello"
  capture = "untagged"
  extra   = "the member's value without its tag"
  [[requirement.arm.assert]]
  kind       = "error_code"
  capture    = "untagged"
  not_equals = "non_canonical_ecf"

[[requirement.arm]]
name   = "non-conformant-witness"
kind   = "non-conformant"
given  = "a peer following ENTITY-CBOR-ENCODING §9.2 item 2 — decode and preserve unknown tags"
expect = "the tagged hello is answered; stored or forwarded, the tagged entity's hash differs from the untagged logical value's, and a peer following §6.3 refuses it on relay"
why    = "exactly the split §6.3 was written to end: 'Tagged and untagged values produce different ECF bytes and different content hashes.'"

[requirement.notes]
peer_attributable = true
oracle_check      = ""
oracle_note       = "no encoding reference check cites §6.3."
