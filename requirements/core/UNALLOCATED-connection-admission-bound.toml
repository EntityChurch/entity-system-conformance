## UNALLOCATED — §4.10(c)'s connection-admission SHOULD.
##
## TWO THINGS ARE WRONG WITH THIS ROW AND THEY ARE INDEPENDENT:
##   1. It has NO §9 inventory row — §9.1's ECP-R66 explicitly excludes it ("not part of this MUST"),
##      and §9.2's nine SHOULD rows do not include it. A SHOULD the reference oracle scores, that the
##      conformance inventory does not list.
##   2. As written it cannot be failed. See `status = "disputed"`.
##
## THE FIRST USE OF `disputed`, and it is used rather than argued for. Arch said they would rather
## see it used once than ratified in the abstract (ROUTING-2026-09-11-l §5).

[requirement]
id_status = "unallocated"
under     = ""                  # no §9 row exists to attach to. NOT a bundled row — an absent one.
title     = "The peer bounds concurrent connections and refuses over-bound connections cleanly"
spec      = "ENTITY-CORE-PROTOCOL §4.10(c)"
spec_also = ["§9.1's resource-bounds row, which EXCLUDES this: \"Connection admission (§4.10(c)) is a SHOULD ... not part of this MUST\""]
snapshot  = "core-0.8.2.21"
level     = "SHOULD"
profile   = ["core"]
surface   = "wire"
status    = "disputed"          # ⭐ shipped disputed rather than guessed at
routed    = "docs/status/FINDINGS-FROM-AUTHORING.md F4 and F5"

reading = """
§4.10(c): "A peer SHOULD bound concurrent connections and refuse over-bound connections cleanly
(`503 too_many_connections` or a connection close). This is NOT a MUST: connection admission is
commonly owned by the layer below the peer (systemd socket limits, a reverse proxy, the OS fd
limit), so a peer MAY rely on an external admission layer rather than self-limiting."

⛔ THE DISPUTE, STATED PLAINLY: **as written, no observation can fail this row.** The two outcomes a
suite can see against a peer under connection pressure are

  (i)  connections are refused        -> satisfied by self-limiting;
  (ii) connections are accepted       -> satisfied by "relies on an external admission layer",
                                         which §4.10(c) explicitly permits;

and (ii) is indistinguishable from a peer that bounds NOTHING and has no external layer either. The
carve-out is a property of the DEPLOYMENT, and nothing in the exchange reports it. So the check that
exists reports a Warn on an outcome that is conformant, non-conformant and undeterminable at once.

That is `GUIDE-CONFORMANCE` §5.2b.1's shape one level up: not a proxy that cannot fail the way the
real case fails, but a REQUIREMENT that cannot fail at all. A row every peer passes by construction
is a row that measures the suite's willingness to write it.

TWO READINGS WITH REAL DEGREES OF FREEDOM, AND WE DECLINE TO PICK ONE ([prohibition 2]):

  READING A — the obligation is on the DEPLOYMENT, and the peer's part is to DECLARE which side of
  the carve-out it is on. Then the row becomes checkable: the posture declares `external_admission =
  true|false`, and with `false` the suite asserts a clean refusal under pressure. Cost: a new posture
  axis, and a peer that lies is unmeasured — but a declaration that can be wrong is still infinitely
  more than a row that cannot be.

  READING B — the obligation is on the PEER's refusal SHAPE, not on whether it bounds: IF the peer
  refuses, the refusal is clean (`503 too_many_connections` or a close), never a hang or a partial
  accept. Then the antecedent is "a refusal occurred", the row is vacuously satisfied when none does,
  and that vacuity is honest and declared rather than hidden.

WE LEAN TO B as the narrower reading that changes no peer's conformance and is checkable today, with
A as the more useful one if the ecosystem wants connection admission actually measured. **We are not
entitled to choose.** Until arch rules, a suite implementing this row reports it as
`SKIP — disputed, see ECP §4.10(c)`, which is honest, and never as a Warn, which is not.

AND THE SEPARATE STRUCTURAL PROBLEM: this obligation has no §9 row, so it has no id. It is not one
of ECP-R1…R98 and it is not a bundled sibling of any of them. §9.1 removes it by name and §9.2 does
not add it. See F4 — the inventory is not exhaustive over the body's binding text, which is a
question about what §9 IS, not about this clause.
"""

[requirement.preconditions]
grants        = []
identities    = ["caller"]
handlers      = []
posture_axes  = ["seed_policy", "external_admission (PROPOSED — does not exist; Reading A needs it)"]

[requirement.dispute]
question      = "Is §4.10(c) an obligation on the deployment (declare which side of the carve-out you are on), or on the refusal shape (if you refuse, refuse cleanly)?"
why_it_matters = "under the first, a peer that bounds nothing and has no external layer is non-conformant and currently scores a Warn. Under the second it is conformant and the Warn is the defect."
owner         = "entity-system-architecture"
our_lean      = "B — narrower, changes no peer's status, checkable today"
blocked_work  = "one requirement; nothing else in the first 55"

[[requirement.arm]]
name  = "reading-b-clean-refusal"
kind  = "conformant"
given = "the peer has refused a connection under admission pressure"
why   = "Reading B's arm, authored so the dispute is CONCRETE rather than a complaint. Runnable the moment B is ruled; deleted the moment A is."
  [[requirement.arm.accept]]
  outcome = "coded_response"
  status  = 503
  code    = "too_many_connections"
  [[requirement.arm.accept]]
  outcome = "connection_closed"
  why     = "§4.10(c) names the close as an equal alternative — 'or a connection close'."
  [[requirement.arm.refuse]]
  outcome = "hang"
  why     = "neither refusal shape. An accepted-then-unanswered connection is the §4.9(c) deliver-or-signal failure wearing an admission decision's clothes."

[[requirement.arm]]
name  = "control"
kind  = "negative-control"
given = "a single connection, no pressure"
why   = "MANDATORY and it is the arm that makes the vacuity visible: it establishes the peer accepts connections at all, so 'no refusal observed' can be reported as vacuous-satisfied rather than as a pass."
  [[requirement.arm.assert]]
  kind = "connected"
  why  = "if this fails the run reports SKIP — the instrument could not establish its own antecedent (§2.4b)."

[requirement.notes]
peer_attributable = false
peer_attributable_why = "under BOTH readings a peer can satisfy this row without implementing anything — Reading A via an external admission layer, Reading B vacuously when no refusal occurs. A row a sibling could ship none of and not move is not a peer result (GUIDE-CONFORMANCE §5.2)."
oracle_check      = "resource_bounds/r3_connection_flood"
oracle_note       = "provenance. The register describes it as 'admission bound; clean refusal or external-delegation Warn' — which is this dispute, already visible in the reference set's own wording."
