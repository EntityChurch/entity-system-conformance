## UNALLOCATED — ENTAILED — the protocol entities a peer emits conform to their §3 type definitions.
##
## Batch 3. What two of the six `encoding` reference checks measure (`signature_signer_is_hash`,
## `caveats_flat_struct`). No sentence places a keyword on the SENDER for type conformance, and no §9
## row names it. The THIRD instance of F11's shape — which F11 said would make the level's basis a
## format change. It does: `level_basis`. F26.

[requirement]
id_status   = "unallocated"
under       = ""
title       = "A §3-typed field in an entity the peer emits holds a value of the declared type: system/hash positions hold hashes, declared structs are maps with correctly typed declared fields"
spec        = "ENTITY-CORE-PROTOCOL §3 ('All protocol types defined as `system/type` entities. This section IS the message specification.')"
spec_also   = ["§3.5 system/signature", "§3.6 system/capability/token, system/capability/delegation-caveats", "§2.10 (open types: extra fields permitted)", "ENTITY-CBOR-ENCODING preamble ('All compliant implementations MUST follow this specification to ensure interoperability')"]
snapshot    = "core-0.8.2.21"
level       = "MUST"
level_basis = "entailed"
profile     = ["core"]
surface     = "wire"
status      = "draft"
routed      = "docs/status/FINDINGS-FROM-AUTHORING.md F26"

reading = """
WHAT THE TEXT SAYS. §3 opens: "All protocol types defined as `system/type` entities. This section IS the
message specification." §3.5 types `system/signature` with `signer: {type_ref: "system/hash"} ; Hash of
signer's peer entity`. §3.6 types `system/capability/delegation-caveats` as a struct of three optional
fields (`no_delegation` bool, `max_delegation_depth` uint, `max_delegation_ttl` uint), carried on the
token as `delegation_caveats: {type_ref: "system/capability/delegation-caveats", optional: true}`.

WHAT IT DOES NOT SAY. No sentence says "a peer MUST emit entities that conform to their type". §2.11's
conformance levels are about RECEIVER validation, and Level 0 ("No type system participation") is fully
conformant. ENTITY-CBOR-ENCODING's "All compliant implementations MUST follow this specification" is a
keyword in the encoding document's preamble, over that document, not over core §3.

WHY AUTHOR IT, AND AT MUST. The entailment is the same shape as F11's two: §5.2 and §5.5 require a
verifier to "compare `signer` against the expected identity hash" (§3.5, MUST, "MUST NOT skip this
check") and §5.3 defines that comparison as byte equality of system/hash values. A signer emitted as a
peer-id string or a public key makes every conformant verifier's MUST unsatisfiable against that peer —
no conformant alternative exists. Likewise a `delegation_caveats` that is not a map with the declared
field types cannot be evaluated by the floor row "Delegation caveat checking (§5.7)" (§5.7 itself is the capability batch's to read whole). So: entailed, not invented. The level is ARGUED, which is
exactly what `level_basis = "entailed"` now declares as data rather than leaving in prose.

⛔ WHAT A NAIVE "FLAT STRUCT" CHECK WOULD GET WRONG (F1's shape). §2.10: "Entities MAY contain fields in
`data` not defined in the type." An extra key in a caveats map is conformant. So the assertion is: the
value is a CBOR map; each DECLARED field that is present has its declared type; nothing more. Absent
optional fields are conformant (§3.6's "Optional field defaults" table).

THE DOMAIN IS WHAT A POSTURE-FREE RUN CAN OBSERVE, and members not observed are reported so. A peer that
mints no caveats emits no `delegation_caveats` — vacuous for that member, never a pass.
"""

[requirement.preconditions]
grants       = []
identities   = ["caller"]
handlers     = []
posture_axes = ["seed_policy"]
note         = "the authenticate response's policy-derived grant (§6.9a.2) is where signatures and tokens appear without any grant. Whether a signature entity appears at all depends on the §6.9a.0 artifact form (detached-signature or tree-as-trust-root, both floor-conformant) — declared as observed or not, never assumed."

[requirement.domain]
axis    = "typed_field"
members = ["system/signature.signer is a system/hash", "system/signature.target is a system/hash", "system/signature.algorithm is a text string", "system/signature.signature is a byte string", "system/capability/token.grantee is a system/hash", "system/capability/token.created_at is an unsigned integer", "system/capability/token.delegation_caveats, when present, is a map whose declared fields have their declared types"]

[[requirement.arm]]
name  = "typed"
kind  = "conformant"
given = "a completed handshake; every system/signature and system/capability/token entity observed in received envelopes"
why   = "the entailed MUST, once per member observed."
  [[requirement.arm.step]]
  op      = "connect"
  capture = "handshake"
  [[requirement.arm.assert]]
  kind    = "each_typed_field_matches_section_3"
  capture = "handshake"
  why     = "type-by-type per member; extra fields ignored (§2.10); absent optionals ignored. A system/hash position is checked as ECP-R12 checks it."
  [[requirement.arm.witness]]
  field = "members_observed"
  why   = "which members this run could see — a member never observed is not covered."

[[requirement.arm]]
name  = "control"
kind  = "negative-control"
given = "the assertion applied to fixtures: a signature whose signer is the peer-id Base58 string; a token whose delegation_caveats is an array [true, 3, 0]; a caveats map with `max_delegation_depth: \"3\"`; AND a caveats map with an extra key `x_future: 1` and correct declared types"
why   = """MANDATORY ANTI-VACUITY, suite-side, with a twist: the fourth fixture MUST PASS. The first three \
prove the assertion detects a type violation; the fourth proves it does not over-assert a closed struct \
— the defect a 'flat struct' check is most likely to have."""
  [[requirement.arm.step]]
  op      = "replay_fixture"
  fixture = "three type-violating entities (must fail) and one open-typed conformant entity (must pass)"
  capture = "fixture"
  [[requirement.arm.assert]]
  kind    = "each_typed_field_matches_section_3"
  capture = "fixture"
  expect  = "fails on the first three; passes on the fourth"

[[requirement.arm]]
name   = "non-conformant-witness"
kind   = "non-conformant"
given  = "a peer that emits signature.signer as its Base58 peer-id"
expect = "every conformant verifier's §3.5 signer comparison fails; the peer's grants verify nowhere but on itself"
why    = "the entailment, made concrete: self-loopback passes, every cross-peer verification fails."

[requirement.notes]
peer_attributable = true
oracle_check      = "encoding/signature_signer_is_hash, encoding/caveats_flat_struct"
oracle_note       = "provenance only. The second check's name reads like a closed-struct assertion; if it fails a caveats map carrying an extra key, that is a check bug against §2.10 — recorded as a PREDICTION would be premature without a peer that emits one."
