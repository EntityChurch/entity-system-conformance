## UNALLOCATED — the responder's own `key_type` must appear in the initiator's advertised
## `key_types`, or the hello is refused with 400 unsupported_key_type.
##
## A BINDING MUST IN §4.5 WITH NO §9 ROW — see UNALLOCATED-hash-format-intersection's header and
## FINDINGS F4. This one carries a second finding of its own: the reject POINT is explicitly
## multi-valued, which makes the obvious check shape wrong.

[requirement]
id_status = "unallocated"
under     = ""
title     = "A hello whose `key_types` accept-set excludes the responder's own key_type is refused with 400 unsupported_key_type"
spec      = "ENTITY-CORE-PROTOCOL §4.5"
spec_also = ["§4.6 (authenticate — the permitted alternative reject point)", "§1.5 (key_type in the peer-id form)", "§4.7"]
snapshot  = "core-0.8.2.21"
level     = "MUST"
profile   = ["core"]
surface   = "wire"
status    = "draft"
routed    = "docs/status/FINDINGS-FROM-AUTHORING.md F4, F6"

reading = """
§4.5, on the accept-set shape: "each peer's own identity `key_type` MUST appear in the other peer's
advertised `key_types` set. If either peer's own `key_type` is absent from the other's set, the
responder MUST reject with `400 unsupported_key_type` ... The responder-side gate (own `key_type` in
initiator's set) is the MUST."

THE ASYMMETRY IS THE REQUIREMENT. §4.5 is careful that `key_types` is NOT a value collapsed to one:
"a `key_type` IS identity-bound: each peer signs with the fixed key its identity holds and cannot
adopt another ... There is no single 'connection key_type'; each peer authors and signs under its
own." So the property is MUTUAL VERIFIABILITY, and the responder-side half -- the only half a
conformance client can drive -- is: *is MY key_type in the set YOU advertised?* A check that
intersects the two sets and demands a non-empty result is testing the single-active-value shape and
would pass a hello whose set overlaps the responder's advertised set while excluding the responder's
actual key.

⚠ THE REJECT POINT IS EXPLICITLY NOT PINNED, AND THIS BREAKS THE OBVIOUS CHECK. §4.5's v7.66 closeout
clarification: hello-time reject is "the canonical earliest reject point", and "Implementations MAY
ALSO reject an unsupported `key_type` later in the handshake (at `authenticate`, on `peer_id` decode,
or on first wire `system/peer` entity received) AS A FALLBACK or DEFENSE-IN-DEPTH; rejecting at
multiple surfaces is conformant." It then says the v7.66 `AGILITY-UNKNOWN-1` vector "is satisfied if
`400 unsupported_key_type` is emitted at ANY handshake surface."

So this requirement asserts THE CODE AND THE OUTCOME, and treats the SURFACE as an observation
rather than an assertion: a peer that accepts the hello and refuses at `authenticate` with
`400 unsupported_key_type` is conformant and MUST NOT be scored against. A check that asserts the
refusal arrives in the hello response is asserting the canonical guidance, which §4.5 marks as
guidance -- in its own words, a later reject is "a conformant but non-canonical reject point."

THE OBSERVATION IS STILL WORTH RECORDING. Which surface a peer rejects at is real, comparable
cohort data and is exactly the kind of fact that later becomes a spec decision. It is emitted as a
`witness` field on the result, never as a verdict.
"""

[requirement.preconditions]
grants       = []
identities   = ["caller"]
handlers     = []
posture_axes = ["seed_policy", "responder_key_type"]
note         = "the probe must EXCLUDE the responder's own key_type, so the run must know it. It is derivable from the responder's peer-id (§1.5: `PeerID := Base58(varint(key_type) || varint(hash_type) || digest)`), which is the honest source — an assumption of `ed25519` is the recommendation, not the peer's."

[[requirement.arm]]
name  = "refused"
kind  = "conformant"
given = "a well-formed hello whose `key_types` is a non-empty set excluding the responder's own key_type"
why   = "§4.5's responder-side MUST."
  [[requirement.arm.step]]
  op        = "send_hello"
  capture   = "excluding"
  key_types = ["$responder_key_type_excluded"]
  note      = "a well-formed key-type name the responder does not hold. NOT an empty set — an empty `key_types` is the absent case and defaults to [\"ed25519\"] (§4.5, §3.8 `optional: true`), which is a different input and probably an intersecting one."
  [[requirement.arm.accept]]
  outcome = "coded_response"
  status  = 400
  code    = "unsupported_key_type"
  at      = "hello"
  why     = "§4.5's canonical earliest reject point."
  [[requirement.arm.accept]]
  outcome = "coded_response"
  status  = 400
  code    = "unsupported_key_type"
  at      = "authenticate"
  why     = "§4.5's explicit MAY — 'rejecting at multiple surfaces is conformant', and the vector 'is satisfied if 400 unsupported_key_type is emitted at ANY handshake surface'. Scoring this as a failure would fail a conformant peer for a documented choice."
  [[requirement.arm.refuse]]
  outcome = "handshake_completes"
  why     = "THE FAILURE: a connection established where the responder's signatures cannot be verified by the caller. Every capability the responder mints on it is unverifiable at the other end."
  [[requirement.arm.witness]]
  field = "reject_surface"
  why   = "recorded, never scored — which surface a peer rejects at is cohort data and is the input to any future decision to pin one."

[[requirement.arm]]
name  = "control"
kind  = "negative-control"
given = "the same hello whose `key_types` INCLUDES the responder's own key_type"
why   = "MANDATORY — proves the refusal discriminates on the accept-set and not on the hello being malformed or the key-type name being unrecognised in general."
  [[requirement.arm.step]]
  op        = "send_hello"
  capture   = "including"
  key_types = ["$responder_key_type"]
  [[requirement.arm.assert]]
  kind       = "error_code"
  capture    = "including"
  not_equals = "unsupported_key_type"

[[requirement.arm]]
name   = "non-conformant-witness"
kind   = "non-conformant"
given  = "a peer that intersects the two advertised sets instead of testing its OWN key_type for membership"
expect = "a hello advertising [\"ed25519\", \"x-other\"] against a responder advertising [\"x-other\"] but HOLDING an ed25519 identity is accepted — the sets intersect and the responder's own key is still unverifiable"
why    = "the discriminating shape, and the reason §4.5 spends a paragraph saying an accept-set is not a single active value. A check built on intersection passes this peer."

[requirement.notes]
peer_attributable = true
oracle_check      = "negotiation/keytype_disjoint_reject"
oracle_note       = "provenance. `format_agility/agility_unknown_1` cites the same clause from the other side (AGILITY-UNKNOWN-1) and is the one row in the register that already reflects the any-surface reading."

[requirement.predicted_disagreement]
against    = "negotiation/keytype_advertised"
prediction = "the reference check requires the responder's hello to carry a non-empty `key_types` set including `ed25519`, which §3.8 makes optional and §4.5 gives a default for"
basis      = "identical in shape to the `format_advertised` prediction — the same optional-field-asserted-as-mandatory reading, in the same category, on the sibling field."
if_true    = "two checks, one defect class, and the pair is stronger evidence than either alone."
if_false   = "there is a MUST-advertise obligation we did not find."
unsettled  = "register description only; settled by a run against a peer that omits the field."
