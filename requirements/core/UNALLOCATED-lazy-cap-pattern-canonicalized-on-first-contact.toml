## UNALLOCATED — a pending non-canonical cap pattern is canonicalized in place when the named peer first connects, and ONLY that one.
##
## Batch 4. §3.6 rule 3, second MUST. The negative control is the one place a trace of the unfolded "no
## auto-correlation" norm (F28) has a text to stand on: "canonicalize THE pending pattern" of "the named peer".

[requirement]
id_status = "unallocated"
under     = ""
title     = "After a never-contacted peer K connects, a stored policy entry whose peers: reference was S(K) reads back as C(K); an entry naming a different uncontacted peer is unchanged"
spec      = "ENTITY-CORE-PROTOCOL §3.6 rule 3 ('On first contact with the named peer (handshake reveals pubkey), the impl MUST canonicalize the pending pattern in place and emit a debug log. Subsequent matches against the canonicalized pattern follow rule 2.')"
spec_also = ["§3.6 ('The transient `pending-canonicalization` state is bounded (one canonicalization event per pattern; idempotent ...)')", "§1.5 multi-form scope ('Cross-form correlation lives in IDENTITY/REGISTRY/POLICY layers')", "UNALLOCATED-lazy-cap-pattern-mint-accepted (the precondition)"]
snapshot  = "core-0.8.2.21"
level     = "MUST"
profile   = ["core"]
surface   = "wire"
status    = "draft"
routed    = "docs/status/FINDINGS-FROM-AUTHORING.md F28, F37"

reading = """
WHAT IS OBSERVABLE OF "IN PLACE". The pattern lives in the stored policy entry the operator wrote; "in place"
means the same entry, at the same path, now carrying `C(K)`. Read back with `system/tree:get` at the path the
configure wrote. The debug log is not observable and not asserted.

WHEN. "On first contact with the named peer (handshake reveals pubkey)". §4.6: the pubkey arrives in
`authenticate`. So the read-back is after K's handshake completes. The text gives no bound on how soon; §6.9a.1
says of the analogous Base58→hex rewrite that "Conformance tests the eventual canonicalized state, not the
precise timing". We apply the same and declare the wait as a posture value (`observation_window`), because a
bound nobody declared is a posture nobody declared.

⚠ THE HANDSHAKE MUST BE CANONICAL. K connects with `C(K)`. If it presented `S(K)`, the handshake itself is
disputed (F31) and a refusal would void this file for a reason that has nothing to do with rule 3.

HOW THE MATCH IS MADE, AND WHY THAT MATTERS FOR THE CONTROL. To canonicalize `S(K)` the impl must recognise
it as K's: compute `S` from the key K presents and compare. That is correlation, and rule 3 requires
it because the operator named the handle. What the
text does NOT license is rewriting a pattern that names SOMEONE ELSE: rule 3 canonicalizes "the pending
pattern" on contact with "the named peer". A peer that rewrites every pending pattern to the first
connecting identity passes the main arm. The control catches it.

F28, SAID ONCE. The reference check for this area's "no auto-correlation" (`peer_mut_2_…`) cites a proposal
norm — "the implementation MUST NOT auto-correlate to past forms of unrelated peers" — that is in no
specification. This file does not score that norm. It scores rule 3's own antecedent, which is narrower: only
the pattern that names the connecting peer changes.
"""

[requirement.preconditions]
grants       = ["system/capability: configure", "system/tree: get on system/capability/policy/*"]
identities   = ["caller", "K (never connected before the configure)", "J (never connected at all)"]
handlers     = ["system/capability with the configure operation"]
posture_axes = ["seed_policy", "observation_window"]
note         = "depends on UNALLOCATED-lazy-cap-pattern-mint-accepted: if that mint was refused there is nothing pending, and this file is void (recorded), not failed."

[[requirement.arm]]
name  = "canonicalized-on-contact"
kind  = "conformant"
given = "two pending entries configured by the caller, each keyed by the hex of an unrelated third suite identity (never K's or J's own key — a Base58-keyed entry for K would be rewritten to hex on K's first contact by §6.9a.1's SHOULD and read back 404 at its old path, a false fail; found by review): E_K with peers.include = [S(K)] and E_J with peers.include = [S(J)]; then K completes a handshake presenting C(K)"
why   = "rule 3's second MUST."
  [[requirement.arm.step]]
  op        = "connect"
  capture   = "operator"
  [[requirement.arm.step]]
  op        = "send_execute"
  capture   = "configure_E_K"
  uri       = "system/capability"
  operation = "configure"
  note      = "policy-entry {peer_pattern: <hex of suite identity T1>, grants: [{handlers: {include: [\"system/tree\"]}, resources: {include: [\"cnf/*\"]}, operations: {include: [\"get\"]}, peers: {include: [S(K)]}}]}"
  [[requirement.arm.step]]
  op        = "send_execute"
  capture   = "configure_E_J"
  uri       = "system/capability"
  operation = "configure"
  note      = "the same shape, peer_pattern <hex of suite identity T2>, peers: {include: [S(J)]}"
  [[requirement.arm.step]]
  op           = "connect"
  capture      = "first_contact_K"
  identity     = "K"
  peer_id_form = "canonical"
  [[requirement.arm.step]]
  op        = "send_execute"
  capture   = "read_E_K"
  uri       = "system/tree"
  operation = "get"
  note      = "after observation_window"
  [[requirement.arm.assert]]
  kind    = "peers_scope_values_equal"
  capture = "read_E_K"
  equals  = "[C(K)]"

[[requirement.arm]]
name  = "control"
kind  = "negative-control"
given = "the same run; E_J read back after K's handshake"
why   = "MANDATORY ANTI-VACUITY. E_J names a peer that has not connected; it must still read S(J). Proves the main arm's rewrite is keyed on the NAMED peer — a peer that canonicalizes every pending pattern to whoever connects next (or deletes pending patterns on any contact) passes the main arm and fails here."
  [[requirement.arm.step]]
  op        = "send_execute"
  capture   = "read_E_J"
  uri       = "system/tree"
  operation = "get"
  [[requirement.arm.assert]]
  kind    = "peers_scope_values_equal"
  capture = "read_E_J"
  equals  = "[S(J)]"

[[requirement.arm]]
name   = "non-conformant-witness"
kind   = "non-conformant"
given  = "a peer that accepts the lazy mint and never revisits it"
expect = "read_E_K still carries S(K) after K has connected"
why    = "rule 2 then compares canonical runtime ids against S(K) forever; the operator's grant to K silently never applies — the failure rule 3 exists to prevent."

[requirement.notes]
peer_attributable = true
oracle_check      = "peer_canonicalization/peer_pattern_2_lazy_canon_mint"
oracle_note       = "the same reference check as the mint file; its citation ('mint ... accepted in pending-canonicalization state') names only the first MUST. Whether it measures this second one is not known from the citation."
